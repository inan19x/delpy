<Input dlp_log>
	Module		im_file
	File		"C:\\path\\to\\delpy\\logs\\delpy.log"
	SavePos		TRUE
	ReadFromLast	TRUE
</Input>

<Output remote_syslog>
	Module		om_tcp
	Host		<SYSLOG_HOST>
	Port		514
	Exec $SourceName = 'delpy';
	Exec		to_syslog_bsd();
</Output>

<Route dlp_to_syslog>
	Path		dlp_log => remote_syslog
</Route>
